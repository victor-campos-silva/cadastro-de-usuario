<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de usuário</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="pagina">
    <h1>Cadastro de usuário</h1>
    <p class="intro">Preencha os dados abaixo para criar seu cadastro.</p>

    <form id="form-cadastro" novalidate>
      <fieldset>
        <legend>Dados pessoais</legend>

        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" autocomplete="name" required>
        </div>

        <div class="linha">
          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="campo">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" autocomplete="tel" placeholder="(11) 99999-9999">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>

        <div class="campo campo-cep">
          <label for="cep">CEP</label>
          <input type="text" id="cep" name="cep" inputmode="numeric" maxlength="9" placeholder="00000-000" autocomplete="postal-code" required>
        </div>

        <p id="status-cep" class="status" role="status" aria-live="polite"></p>

        <div class="linha">
          <div class="campo campo-grande">
            <label for="logradouro">Rua</label>
            <input type="text" id="logradouro" name="logradouro" autocomplete="address-line1" required>
          </div>
          <div class="campo campo-pequeno">
            <label for="numero">Número</label>
            <input type="text" id="numero" name="numero" required>
          </div>
        </div>

        <div class="campo">
          <label for="complemento">Complemento</label>
          <input type="text" id="complemento" name="complemento">
        </div>

        <div class="linha">
          <div class="campo">
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" name="bairro" required>
          </div>
          <div class="campo">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" required>
          </div>
          <div class="campo campo-uf">
            <label for="uf">UF</label>
            <input type="text" id="uf" name="uf" maxlength="2" required>
          </div>
        </div>
      </fieldset>

      <div class="acoes">
        <button type="submit" class="botao-principal">Salvar cadastro</button>
        <button type="button" id="btn-limpar" class="botao-secundario">Limpar formulário</button>
      </div>

      <p id="status-form" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
